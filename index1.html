
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محمد ❤️</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #090921, #32134d, #090921);
    color: white;
    font-family: Tahoma, sans-serif;
    text-align: center;
    overflow-x: hidden;
}

.container {
    padding: 60px 15px;
}

h1 {
    font-size: 75px;
    color: #ffb5df;
    text-shadow: 0 0 25px #ff36a5;
}

.heart {
    font-size: 75px;
    animation: beat 1s infinite;
}

@keyframes beat {
    50% { transform: scale(1.3); }
}

.poem {
    max-width: 500px;
    margin: 30px auto;
    padding: 25px;
    border: 1px solid #ff9bda;
    border-radius: 20px;
    background: #ffffff12;
    line-height: 2.5;
    font-size: 19px;
}

button {
    padding: 15px 30px;
    border: none;
    border-radius: 30px;
    background: #ff48a5;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

#message {
    display: none;
    margin: 25px;
    color: #ffb5df;
    font-size: 22px;
}

.floating {
    position: fixed;
    bottom: -30px;
    animation: rise 6s linear forwards;
    pointer-events: none;
}

@keyframes rise {
    to {
        transform: translateY(-110vh);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="container">

    <p>✦ عالم خاص ✦</p>

    <h1>محمد</h1>

    <div class="heart">❤️</div>

    <div class="poem">
        يا محمد يا نجم في السما منوّر<br>
        يا صاحب القلب الجميل المتصوّر<br>
        في كل حرف ليك حكاية جميلة<br>
        وفي كل يوم ذكراك تفضل أصيلة<br>
        تبقى الأماني ليك أجمل طريق<br>
        وتفضل دايمًا في الحياة بريق ✨
    </div>

    <button onclick="showMessage()">
        اضغط هنا ❤️
    </button>

    <div id="message">
        محمد، أنت بطل حكايتك الجميلة ❤️
    </div>

</div>

<script>
function showMessage() {
    document.getElementById("message").style.display = "block";
}

setInterval(function() {
    let heart = document.createElement("div");
    heart.className = "floating";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = "25px";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 6000);
}, 500);
</script>

</body>
</html>
